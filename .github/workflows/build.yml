          arduino-cli lib install "XPT2046_Touchscreen"

      - name: Versie uitlezen
        id: versie
        run: |
          V=$(grep 'BLANCO_VERSIE' BKOS_blanco/ota.h | grep -o '"[^"]*"' | tr -d '"')
          echo "versie=$V" >> "$GITHUB_OUTPUT"

      - name: Compileren CYD28
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=default,FlashFreq=80,FlashMode=dio" \
            --build-property "compiler.cpp.extra_flags=-DPLATFORM_CYD28=1" \
            --output-dir build_cyd28 \
            BKOS_blanco/

      - name: Firmware opslaan
        run: |
          mkdir -p firmware
          cp build_cyd28/BKOS_blanco.ino.bin firmware/bkos_blanco_cyd28.bin
          echo "${{ steps.versie.outputs.versie }}" > firmware/versie_cyd28.txt

      - name: Commit en push CYD28 firmware
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase
          git add firmware/bkos_blanco_cyd28.bin firmware/versie_cyd28.txt
          git diff --cached --quiet || git commit -m "CI: bkos_blanco_cyd28.bin ${{ steps.versie.outputs.versie }}"
          git push

  build_cyd40h:
