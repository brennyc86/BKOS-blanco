        uses: actions/checkout@v4

      - name: Arduino CLI installeren
        uses: arduino/setup-arduino-cli@v1

      - name: arduino-pico platform installeren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@5.4.4

      - name: Bibliotheken installeren
        run: |
          arduino-cli lib install "Arduino_GFX_Library"
          arduino-cli lib install "XPT2046_Touchscreen"
          arduino-cli lib install "Preferences@2.2.2"

      - name: Versie uitlezen
        id: versie
        run: |
          V=$(grep 'BLANCO_VERSIE' BKOS_blanco/ota.h | grep -o '"[^"]*"' | tr -d '"')
          echo "versie=$V" >> "$GITHUB_OUTPUT"

      - name: Compileren Pico W
        run: |
          arduino-cli compile \
            --fqbn "rp2040:rp2040:rpipicow:flash=2097152_65536,freq=133,opt=Optimize2,rtti=Disabled,exceptions=Disabled,dbgport=Disabled,dbglvl=None,usbstack=picosdk,ipbtstack=ipv4only" \
            --output-dir build_pico \
            BKOS_blanco/

      - name: Firmware opslaan
